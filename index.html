<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rappel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rappel">
<meta name="theme-color" content="#0b2a23">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg1:#f7f2e6;--bg2:#ece3cc;--card:rgba(255,255,255,.78);--line:rgba(18,52,44,.10);
  --ink:#16231e;--mute:#66736c;--accent:#12342c;--chip:rgba(18,52,44,.07);
  --ok1:#3aa66b;--ok2:#22784b;--gold1:#f0d27d;--gold2:#c39437;--red1:#e5534b;--red2:#b3261e;--warn:#d9922a;
  --hero1:#0f3b31;--hero2:#1d6b55;--shadow:0 10px 30px rgba(18,52,44,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0b1f1a;--bg2:#06110e;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.08);
  --ink:#eef3ee;--mute:#93a59c;--accent:#f0d27d;--chip:rgba(255,255,255,.07);
  --hero1:#14493c;--hero2:#0d2b24;--shadow:0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:radial-gradient(120% 60% at 50% 0%,var(--bg1),var(--bg2)) fixed;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(160px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.15;margin:12px 0 2px;letter-spacing:-.02em}
.date{color:var(--mute);font-size:15px}.date::first-letter{text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pill{font-size:14px;font-weight:700;padding:7px 12px;border-radius:99px;color:#1b1608;background:linear-gradient(135deg,var(--gold1),var(--gold2));white-space:nowrap}
h2{display:flex;align-items:center;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 4px 8px}
.help{width:26px;height:26px;padding:0;border-radius:50%;font-size:14px;font-weight:700;background:var(--chip);color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero{color:#fff;border:0;background:linear-gradient(145deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(240,210,125,.35),transparent 70%)}
.hero small{opacity:.75;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.hero .name{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.hero .when{font-size:17px;color:var(--gold1);font-weight:600}
.times{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);position:relative;z-index:1}
.times div{text-align:center;font-size:12px;opacity:.6}.times b{display:block;font-size:15px}
.times .cur{opacity:1;color:var(--gold1)}.times .past{opacity:.35}
.quote{font-size:17px;line-height:1.55}.ref{color:var(--mute);font-size:13px;margin-top:8px}
.ar{font-family:"Geeza Pro","Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:26px;direction:rtl;text-align:right;line-height:2}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pname{font-weight:600}.pname small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#1b1608;background:linear-gradient(135deg,var(--gold1),var(--gold2));padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--chip);color:var(--ink);cursor:pointer;transition:transform .08s}
button:active{transform:scale(.96)}
.seg{display:flex;gap:6px;flex:none}.seg button{font-size:14px;padding:10px 11px;white-space:nowrap}
.pname .tag{display:table;margin:4px 0 0}
.on1{background:linear-gradient(135deg,var(--ok1),var(--ok2))!important;color:#fff!important}
.on2{background:linear-gradient(135deg,var(--gold1),var(--gold2))!important;color:#1b1608!important;font-weight:700}
.primary{background:linear-gradient(135deg,var(--hero2),var(--hero1));color:#fff;font-weight:700}
.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#1b1608;font-weight:700}
.danger{background:transparent;border:1.5px solid var(--red1);color:var(--red1);font-weight:600}
.wide{width:100%;padding:16px;font-size:17px}
.counter{display:flex;align-items:center;gap:10px}.counter b{min-width:34px;text-align:center;font-size:24px}
.counter button{width:48px;height:48px;padding:0;font-size:24px;border-radius:14px}
.bar{position:relative;height:10px;background:var(--chip);border-radius:9px;margin-top:14px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok1),var(--gold2));transition:width .3s}
.bar .mark{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.5}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.status{border-radius:20px;padding:18px;margin:18px 0;text-align:center}
.status.ok{color:#fff;background:linear-gradient(135deg,var(--ok1),var(--ok2))}
.status.no{background:var(--card);border:1px dashed var(--line)}
.status b{display:block;font-size:19px}.status span{font-size:14px;opacity:.85}
label.chk{display:flex;gap:12px;align-items:center;width:100%;cursor:pointer}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--chip);flex:none;display:grid;place-items:center;margin:0}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--ok1),var(--ok2));border-color:transparent}
input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:16px;font-weight:800}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.more{color:var(--mute);font-size:14px;padding-top:10px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.grid span{aspect-ratio:1;border-radius:6px;background:var(--chip)}
.grid .g{background:linear-gradient(135deg,var(--ok1),var(--ok2))}.grid .a{background:var(--warn)}.grid .r{background:var(--red1)}.grid .t{outline:2px solid var(--accent);outline-offset:1px}
.big{font-size:56px;font-weight:800;text-align:center;letter-spacing:-.03em;line-height:1}
.mute{color:var(--mute);font-size:14px}.center{text-align:center}
.steps{counter-reset:s}.stepc{display:flex;gap:12px}.stepc .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--chip)}
.stepc.done .n{background:linear-gradient(135deg,var(--ok1),var(--ok2));color:#fff}
.blk summary{display:flex;align-items:center;gap:12px;font-weight:600}
.blk .body{padding:10px 0 0 42px;font-size:15px}.blk ol{padding-left:18px;margin:6px 0}.blk li{margin:6px 0}
.phase{display:flex;gap:12px;align-items:flex-start}.phase .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--chip)}
.phase.cur .n{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#1b1608}.phase.done .n{background:linear-gradient(135deg,var(--ok1),var(--ok2));color:#fff}
.phase.next{opacity:.55}
#sos{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;color:#fff;font-weight:800;font-size:17px;padding:16px;border-radius:18px;
  background:linear-gradient(135deg,var(--red1),var(--red2));box-shadow:0 10px 28px rgba(179,38,30,.45)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:10px 4px 12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;filter:grayscale(1);opacity:.6}nav button.cur{color:var(--accent);font-weight:700}nav button.cur span{filter:none;opacity:1}
.overlay{position:fixed;inset:0;z-index:10;overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px 40px;background:radial-gradient(120% 60% at 50% 0%,var(--bg1),var(--bg2))}
.overlay h1{font-size:32px}.overlay p{font-size:18px}
.timer{font-size:60px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 18px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--chip)}.dots i.on{background:var(--gold2);width:22px;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button.sel{background:linear-gradient(135deg,var(--hero2),var(--hero1));color:#fff}
textarea{width:100%;font:inherit;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.code{font-size:72px;letter-spacing:.25em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:85vh;overflow:auto;background:var(--bg1);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 8px;font-size:21px}.sheet p{margin:8px 0}
.slide-ic{font-size:64px;text-align:center;margin:30px 0 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="view"></main>
<button id="sos">🆘 J'ai envie de retomber</button>
<nav id="tabs">
  <button data-t="jour"><span>🏠</span>Aujourd'hui</button><button data-t="plan"><span>🧭</span>Mon plan</button><button data-t="suivi"><span>📈</span>Progrès</button><button data-t="bloc"><span>🛡️</span>Protection</button>
</nav>
<div class="overlay" id="ov" hidden></div>
<div class="sheet" id="sh" hidden><div id="shc"></div></div>

<script src="content.js"></script>
<script src="times.js"></script>
<script>
const PRIERES = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
const PHASES = [
  { nom: "Fondations", mosq: [0, 4], qmin: 2, qobj: 6 },
  { nom: "Constance", mosq: [0, 3, 4], qmin: 3, qobj: 8 },
  { nom: "Dépassement", mosq: [0, 1, 2, 3, 4], qmin: 4, qobj: 10 },
];
const PLAN_START = "2026-11-17";
const KEY = "rappel-v1";
const JUMUA = 14 * 60; // shortcut: Jumua figé à 14:00 (Mawaqit), à changer si la mosquée le modifie

const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => keyOf(new Date());
const diff = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return keyOf(d); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hm = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmt = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const listFr = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1];

// ---------- Données ----------
const defaults = (x) => { x = x || {}; x.start ??= today(); x.phase ??= 1; x.days ??= {}; x.falls ??= []; x.urges ??= []; x.bl ??= {}; return x; };
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch {}
S = defaults(S);
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { alert("Sauvegarde impossible sur cet appareil."); } }
const day = (k = today()) => (S.days[k] ??= { p: [0, 0, 0, 0, 0], q: 0, am: 0, pm: 0, ts: 0 });
const phase = () => PHASES[S.phase - 1];
const tenue = (d, ph = phase()) => d && d.p.every((x) => x > 0) && d.q >= ph.qmin && d.am && d.pm;
function manque(d) {
  const m = [], p = PRIERES.filter((_, i) => !d.p[i]);
  if (p.length) m.push(p.length === 5 ? "les 5 prières" : listFr(p));
  if (d.q < phase().qmin) m.push(`${phase().qmin - d.q} page${phase().qmin - d.q > 1 ? "s" : ""} de Coran`);
  if (!d.am) m.push("les adhkar du matin");
  if (!d.pm) m.push("les adhkar du soir");
  return m;
}

function streaks() {
  const pts = [S.start, ...S.falls.map((f) => f.d)].sort();
  const cur = diff(pts[pts.length - 1], today());
  let best = cur;
  for (let i = 1; i < pts.length; i++) best = Math.max(best, diff(pts[i - 1], pts[i]));
  return { cur, best };
}
// Passage de phase : 20 des 30 derniers jours avec toutes les prières « mosquée » de la phase.
function phaseProgress() {
  let n = 0;
  for (let i = 0; i < 30; i++) { const d = S.days[ago(i)]; if (d && phase().mosq.every((j) => d.p[j] === 2)) n++; }
  return n;
}
function checkPhase() {
  if (S.phase < 3 && phaseProgress() >= 20) { S.phase++; save(); sheet(`<h3>Machaallah 🌙</h3><p>Phase ${S.phase} débloquée : <b>${phase().nom}</b>.</p><p>Nouveau but mosquée : ${listFr(phase().mosq.map((j) => PRIERES[j]))}.</p>`); }
}

// ---------- Horaires de la mosquée ----------
function horaires(date) {
  const row = TIMES.calendar[date.getMonth()][String(date.getDate())], iq = TIMES.iqama[date.getMonth()][String(date.getDate())];
  const a = [row[0], row[2], row[3], row[4], row[5]].map(hm);
  const q = a.map((x, i) => (iq[i][0] === "+" ? x + Number(iq[i].slice(1)) : hm(iq[i])));
  const vendredi = date.getDay() === 5;
  if (vendredi) q[1] = JUMUA;
  return { a, q, vendredi };
}
function prochaine() {
  const now = new Date(), min = now.getHours() * 60 + now.getMinutes(), h = horaires(now);
  for (let i = 0; i < 5; i++) if (h.q[i] > min) return { i, h, min, demain: false };
  const t = new Date(now); t.setDate(t.getDate() + 1);
  return { i: 0, h: horaires(t), min: min - 24 * 60, demain: true };
}
const duree = (m) => (m >= 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)}` : `${m} min`);
function heroHTML() {
  const { i, h, min, demain } = prochaine(), now = horaires(new Date());
  const nom = i === 1 && h.vendredi ? "Jumua" : PRIERES[i];
  const quand = min < h.a[i] ? `dans ${duree(h.a[i] - min)}` : `adhan passé · iqama dans ${duree(h.q[i] - min)}`;
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  return `<small>Prochaine prière${demain ? " · demain" : ""}</small>
    <div class="name">${nom}</div>
    <div class="when">${quand}</div>
    <div style="opacity:.8;font-size:14px;margin-top:2px">Adhan ${fmt(h.a[i])} · iqama ${fmt(h.q[i])}${ph().mosq.includes(i) ? " · 🕌 objectif mosquée" : ""}</div>
    <div class="times">${PRIERES.map((n, j) => `<div class="${!demain && j === i ? "cur" : now.q[j] <= nowMin && !demain ? "past" : ""}">${j === 1 && now.vendredi ? "Jumua" : n}<b>${fmt(j === 1 && now.vendredi ? JUMUA : now.a[j])}</b></div>`).join("")}</div>`;
}
const ph = phase;

const texteDuJour = () => { const n = CONTENT.textes.length; const i = diff(PLAN_START, today()) * 2; return CONTENT.textes[((i % n) + n) % n]; };
const coucher = () => { const w = Math.max(0, Math.floor(diff(PLAN_START, today()) / 7)); const m = Math.max(22 * 60 + 30, 23 * 60 + 30 - 15 * w); return `${Math.floor(m / 60)}h${pad(m % 60)}`; };
const dhikrList = (arr) => arr.map((x) => `<div class="row" style="display:block"><div class="ar">${x.ar}</div><div>${esc(x.fr)} ${x.n ? `<b>×${x.n}</b>` : ""}</div><div class="ref">${esc(x.r)}</div></div>`).join("");

// ---------- Aides « ? » ----------
const HELP = {
  prieres: `<h3>Mes prières</h3>
    <p>Après chaque prière, touche :</p>
    <p><b>À l'heure</b> : tu l'as faite à son heure, même chez toi.<br>🕌 <b>Mosquée</b> : tu l'as faite à la mosquée.</p>
    <p>Retouche le même bouton pour annuler.</p>
    <p>Les prières avec l'étiquette <span class="tag">objectif mosquée</span> sont celles que ton plan te demande de faire à la mosquée en ce moment. Pour la journée tenue, « à l'heure » suffit toujours.</p>`,
  coran: `<h3>Minimum et objectif</h3>
    <p><b>Minimum</b> : ce que tu fais même les mauvais jours. C'est ce qui compte pour la « journée tenue ».</p>
    <p><b>Objectif</b> : ce que tu vises quand tu as la force. Ce n'est pas obligatoire.</p>
    <p>Touche <b>+1</b> à chaque page lue. Le trait sur la barre montre le minimum.</p>`,
  dhikr: `<h3>Dhikr</h3>
    <p><b>Adhkar du matin</b> (après Fajr) et <b>du soir</b> (après Asr ou le soir) : les invocations de la liste. Coche quand c'est fait.</p>
    <p><b>Tasbih après la prière</b> (facultatif) : 33 SubhanAllah, 33 Alhamdulillah, 34 Allahu Akbar. Compte combien de prières tu l'as fait aujourd'hui, sur 5.</p>`,
  tenue: `<h3>Journée tenue</h3>
    <p>Ta journée est tenue quand tu as fait ton <b>minimum</b> :</p>
    <p>• les 5 prières à l'heure (même chez toi)<br>• le minimum de pages de Coran<br>• les adhkar du matin et du soir</p>
    <p>Un jour difficile où tu fais juste le minimum est une victoire. L'acte le plus aimé d'Allah est le plus régulier, même s'il est petit (Bukhari 6464).</p>`,
  plan: `<h3>Comment marche le plan</h3>
    <p>Il y a 3 phases. Chacune ajoute <b>une prière à la mosquée</b> et un peu plus de Coran.</p>
    <p>Tu passes à la phase suivante quand tu as fait toutes tes prières « objectif mosquée » <b>20 jours sur les 30 derniers</b>. Pas de date limite : tu avances à ton rythme.</p>
    <p>Tu ne recules jamais de phase, même après une chute.</p>`,
  rappels: `<h3>D'où viennent les notifications ?</h3>
    <p>Les rappels (Fajr, zone rouge, hadith…) viennent de l'app <b>Calendrier</b> de ton iPhone, dans le calendrier « Rappel » que tu as importé. Cette app-ci sert à suivre ta journée et à t'aider quand ça monte.</p>
    <p>Pas de notification ? Réglages → Notifications → Calendrier → autoriser.</p>`,
};
function sheet(html) {
  document.getElementById("shc").innerHTML = html + `<p style="margin-top:18px"><button class="gold wide" data-close>Compris</button></p>`;
  document.getElementById("sh").hidden = false;
}
document.getElementById("sh").onclick = (e) => { if (e.target.id === "sh" || e.target.closest("[data-close]")) document.getElementById("sh").hidden = true; };
const h2 = (titre, aide) => `<h2>${titre}${aide ? `<button class="help" data-help="${aide}" aria-label="Aide">?</button>` : ""}</h2>`;

// ---------- Écrans ----------
const views = {
  jour() {
    const d = day(), p = phase(), t = texteDuJour(), { cur } = streaks(), ok = tenue(d), m = manque(d);
    const dateFr = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    return `
    <div class="top"><div><div class="date">${dateFr}</div><h1>Salam 👋</h1></div><span class="pill">🌙 ${cur} jour${cur > 1 ? "s" : ""}</span></div>
    <div class="card hero" id="hero">${heroHTML()}</div>
    <div class="card"><div class="quote">« ${esc(t.t)} »</div><div class="ref">${esc(t.r)}</div></div>

    ${h2("Mes prières", "prieres")}
    <div class="card">${PRIERES.map((n, i) => `<div class="row">
        <div class="pname">${n}${p.mosq.includes(i) ? '<span class="tag">objectif mosquée</span>' : ""}</div>
        <div class="seg"><button class="${d.p[i] === 1 ? "on1" : ""}" data-p="${i}" data-v="1">À l'heure</button><button class="${d.p[i] === 2 ? "on2" : ""}" data-p="${i}" data-v="2">🕌 Mosquée</button></div>
      </div>`).join("")}</div>

    ${h2("Coran", "coran")}

      <div class="seg" style="margin-top:12px"><button id="exp">⬇️ Exporter</button><button id="impb">⬆️ Importer</button><input type="file" id="imp" accept=".json" hidden></div></div>`;

  bloc() {
    const STEPS = [
      ["apps", "Supprimer les apps qui te font tomber", `<p>Supprime <b>X, Reddit, Opera, Chrome et l'app Google</b>. Garde Safari, il sera filtré.</p>`],
      ["code", "Créer le code Temps d'écran", `<ol><li>Ouvre <b>Réglages → Temps d'écran → Utiliser un code Temps d'écran</b>, puis reviens ici.</li>
        <li>Touche le bouton ci-dessous. Un code de 4 chiffres apparaît 60 secondes, puis il est effacé pour toujours (il n'est enregistré nulle part).</li>

    ];
    const done = STEPS.filter(([id]) => S.bl[id]).length;

        <div class="body">${body}<label class="chk" style="margin-top:12px"><input type="checkbox" data-bl="${id}" ${S.bl[id] ? "checked" : ""}> C'est fait</label></div>
      </details>`).join("")}</div>`;

};

// ---------- Rendu et événements ----------
let tab = "jour";
function render() {
  document.getElementById("view").innerHTML = views[tab]();
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("cur", b.dataset.t === tab));
  window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY; document.getElementById("view").innerHTML = views[tab](); window.scrollTo(0, y); }
setInterval(() => { const el = document.getElementById("hero"); if (tab === "jour" && el) el.innerHTML = heroHTML(); }, 30000);

document.getElementById("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) { tab = b.dataset.t; render(); } };
const view = document.getElementById("view");
view.addEventListener("click", (e) => {
  const b = e.target.closest("[data-help],button"); if (!b) return;
  if (b.dataset.help) return sheet(HELP[b.dataset.help]);
  if (b.dataset.p) { const d = day(), i = +b.dataset.p, v = +b.dataset.v; d.p[i] = d.p[i] === v ? 0 : v; save(); checkPhase(); return rerender(); }
  if (b.dataset.q) { const d = day(); d.q = Math.max(0, d.q + Number(b.dataset.q)); save(); return rerender(); }
  if (b.dataset.ts) { const d = day(); d.ts = Math.min(5, Math.max(0, d.ts + Number(b.dataset.ts))); save(); return rerender(); }
  if (b.id === "fall") { if (confirm("Noter une chute aujourd'hui ? Ton compteur repart à zéro, ton meilleur score reste.")) { S.falls.push({ d: today(), t: new Date().toISOString() }); save(); tawba(); } }
  else if (b.id === "gen") genCode();
  else if (b.id === "exp") exportData();
  else if (b.id === "impb") document.getElementById("imp").click();
});
view.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.k) { day()[t.dataset.k] = t.checked ? 1 : 0; save(); rerender(); }
  if (t.dataset.bl) {
    S.bl[t.dataset.bl] = t.checked; save();
    const st = document.getElementById("st-" + t.dataset.bl); st.classList.toggle("done", t.checked);
    st.querySelector(".n").textContent = t.checked ? "✓" : [...document.querySelectorAll("[data-bl]")].indexOf(t) + 1;
    document.getElementById("blp").textContent = `${Object.values(S.bl).filter(Boolean).length}/${document.querySelectorAll("[data-bl]").length}`;
  }
  if (t.id === "imp") importData(t.files[0]);
});

function exportData() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" }));
  a.download = `rappel-${today()}.json`; a.click();
}
function importData(f) {
  if (!f) return;
  f.text().then((txt) => {
    const x = JSON.parse(txt);
    if (!x || typeof x.days !== "object" || !Array.isArray(x.falls)) throw 0;
    if (confirm("Remplacer les données actuelles par ce fichier ?")) { S = defaults(x); save(); render(); }
  }).catch(() => alert("Fichier invalide."));
}

function genCode() {
  const c = String(crypto.getRandomValues(new Uint32Array(1))[0] % 10000).padStart(4, "0");
  const box = document.getElementById("codebox");
  let s = 60;
  box.innerHTML = `<div class="code">${c}</div><div class="mute center">s'efface dans <b id="cs">60</b> s</div>`;
  const it = setInterval(() => { s--; const el = document.getElementById("cs"); if (el) el.textContent = s; if (s <= 0 || !el) { clearInterval(it); const bx = document.getElementById("codebox"); if (bx) bx.innerHTML = '<div class="mute center" style="margin-top:10px">Code effacé.</div>'; } }, 1000);
}

// ---------- Urgence ----------
const ov = document.getElementById("ov");
let timer = null;
function closeOv() { clearInterval(timer); ov.hidden = true; ov.innerHTML = ""; render(); }

function urgence() {
  const textes = CONTENT.textes.filter((x) => x.u);
  const t = textes[Math.floor(Math.random() * textes.length)];
  const end = Date.now() + 10 * 60 * 1000;
  const u = { d: today(), t: new Date().toISOString(), why: "", note: "", held: false };
  const steps = [
    `<div class="slide-ic">🌊</div><h1>Stop. 10 minutes.</h1><p>L'envie monte comme une vague, puis elle redescend. Elle ne dure pas.</p><p>Suis les étapes une par une, sans réfléchir.</p>`,
    `<div class="slide-ic">🚶</div><h1>Lève-toi.</h1><p>Quitte la pièce où tu es. Va là où il y a du monde ou de la lumière. Garde cette app ouverte, rien d'autre.</p><div class="card"><div class="ar">أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ</div><div class="mute">A'udhu billahi mina sh-shaytani r-rajim — dis-le maintenant.</div></div>`,
    `<div class="slide-ic">💧</div><h1>Ablutions à l'eau froide.</h1><p>Prends ton temps. L'eau froide calme le corps.</p><div class="card"><div class="quote">« Quiconque fait bien ses ablutions puis prie deux rakaat en y étant présent de cœur et de corps, le Paradis lui est dû. »</div><div class="ref">Muslim 234</div></div>`,
    `<div class="slide-ic">🤲</div><h1>Prie deux rakaat.</h1><p>Lentement. Dans la prosternation, demande à Allah de te protéger, avec tes propres mots.</p>`,
    `<h1>Dhikr.</h1><div class="card"><div class="ar">يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَىٰ دِينِكَ</div><div class="mute">Ya Muqallib al-qulub, thabbit qalbi 'ala dinik ×7 — Tirmidhi 2140</div></div>
     <div class="card center"><div class="mute">Touche à chaque « La hawla wa la quwwata illa billah »</div><button class="gold" id="cnt" style="font-size:30px;width:100%;padding:26px;margin-top:10px;border-radius:18px">0 / 33</button></div>
     <div class="card"><div class="quote">« ${esc(t.t)} »</div><div class="ref">${esc(t.r)}</div></div>`,
    `<h1>Qu'est-ce qui t'a poussé ?</h1><div class="chips">${["Solitude", "Fatigue", "Ennui", "Stress", "Tristesse", "Autre"].map((w) => `<button data-why="${w}">${w}</button>`).join("")}</div>
     <p><textarea id="note" rows="2" placeholder="Une phrase (facultatif)"></textarea></p>
     <button class="primary wide" id="held">✅ J'ai tenu, alhamdulillah</button>
     <p><button class="danger wide" id="fell">J'ai chuté</button></p>`,
  ];
  let i = 0, cnt = 0;
  const draw = () => {
    ov.innerHTML = `<div class="timer" id="tm"></div><div class="dots">${steps.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>${steps[i]}
      ${i < steps.length - 1 ? `<p><button class="gold wide" id="next">C'est fait →</button></p>` : ""}
      <p class="center"><button id="quit" style="background:none" class="mute">Fermer</button></p>`;
    tick(); window.scrollTo(0, 0); ov.scrollTop = 0;
  };
  const tick = () => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = document.getElementById("tm"); if (el) el.textContent = s ? `${Math.floor(s / 60)}:${pad(s % 60)}` : "10 min ✓"; };
  const finish = (held) => {
    u.held = held; u.note = (document.getElementById("note") || {}).value || "";
    S.urges.push(u);
    if (!held) S.falls.push({ d: today(), t: new Date().toISOString() });
    save();
    if (!held) { clearInterval(timer); return tawba(); }
    ov.innerHTML = `<div class="slide-ic">🌟</div><h1>Alhamdulillah.</h1><p>Tu viens de gagner une bataille. Chaque fois que tu tiens, la suivante devient plus facile.</p><div class="card"><div class="quote">« Celui qui délaisse une chose pour Allah, Allah la lui remplace par mieux. »</div><div class="ref">Ahmad (authentifié par al-Albani)</div></div><button class="gold wide" id="quit">Fermer</button>`;
  };
  ov.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "next") { i++; draw(); }
    else if (b.id === "quit") closeOv();
    else if (b.id === "cnt") { cnt = Math.min(33, cnt + 1); b.textContent = cnt === 33 ? "33 / 33 ✓" : `${cnt} / 33`; }
    else if (b.dataset.why) { u.why = b.dataset.why; ov.querySelectorAll("[data-why]").forEach((x) => x.classList.toggle("sel", x === b)); }
    else if (b.id === "held") finish(true);
    else if (b.id === "fell") finish(false);
  };
  ov.hidden = false; draw();
  clearInterval(timer); timer = setInterval(tick, 1000);
}

function tawba() {
  const { best } = streaks();
  ov.onclick = (e) => { if (e.target.id === "quit") closeOv(); };
  ov.innerHTML = `<div class="slide-ic">🤍</div><h1>On repart. Maintenant.</h1>
    <div class="card"><div class="quote">« Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. »</div><div class="ref">Coran 39:53</div></div>

    </div>

    <button class="gold wide" id="quit">Je repars</button>`;
  ov.hidden = false; ov.scrollTop = 0;
}

  const draw = () => {
    ov.innerHTML = `<div class="dots">${slides.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div>${slides[i]}
      <p><button class="gold wide" id="ob">${i < slides.length - 1 ? "Suivant →" : "Bismillah, on commence"}</button></p>`;
  };
  ov.onclick = (e) => {
    if (e.target.id !== "ob") return;
    if (++i < slides.length) draw(); else { S.seen = 1; save(); closeOv(); }
  };
  ov.hidden = false; draw();
}

document.getElementById("sos").onclick = urgence;
render();
if (!S.seen) onboarding();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script>
</body>
